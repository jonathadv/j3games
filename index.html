<html>

<head>
   <title>J3 Games</title>
   <link rel="SHORTCUT ICON" href="imagens/Logoweb.gif" type="image/x-icon">
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"></script>
   <link href="assets/j3games/main.css" rel="stylesheet">
   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
   <script src="assets/j3games/main.js"></script>
   <script src="static/ruffle/ruffle.js"></script>
</head>

<body background="imagens/J3Games-fundo2.png">
   <div id="header"></div>
   <div id="title"></div>
   <div class="container" style="width: 45%">
      <div class="row justify-content-md-center border border-secondary" id="gameContainer" style="background-color: #000000">
          <object id="gameObject" type="application/x-shockwave-flash" 
            data="/jogos/Plants vs Zombies.swf" 
            width="800" 
            height="600">
          <param name="movie" value="game.swf">
          <param name="quality" value="high">
          <param name="allowScriptAccess" value="always">
          <param name="wmode" value="transparent">
          <p>To play this game, you need Adobe Flash Player (or a Flash emulator like Ruffle).</p>
        </object>
    </div>
   </div>

   <div class="container">
      <div class="row">
          <div class="col"></div>
          <div class="col">
              <div class="container text-center p-3">
                  <img src="" id="titleImg" style="width: 50%;">
              </div>
          </div>
          <div class="col"></div>
      </div>
  </div>

   <div class="container" style="width: 40%">
      <div class="row justify-content-md-center border border-secondary gameBackground p-2" id="gameList"></div>
      <div id="footer">
      </div>
   </div>
</body>

</html>
